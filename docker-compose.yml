# Settings and secrets come from an optional .env file next to this one (KEY=value lines); keep it out of git.
services:
  pdfeditor:
    build:
      context: .
      args:
        OCR_LANGS: ${OCR_LANGS:-eng}  # Tesseract languages baked into the image, e.g. "eng deu fra"
    image: pdfeditor
    ports:
      # Reachable from this machine only by default. BIND=0.0.0.0 opens it to the network: choose a sign-in in setup first.
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - data:/data   # the settings chosen in the first-run setup
    environment:
      APP_NAME: ${APP_NAME:-pdfeditor}          # title shown in the UI and the API docs
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}      # largest accepted upload
      CONVERT_TIMEOUT: ${CONVERT_TIMEOUT:-300}  # seconds LibreOffice or OCR may spend on one file
      WORKERS: ${WORKERS:-2}                    # one PDF job at a time per worker
      # Optional, instead of the first-run setup: a sign-in and mail server from .env (see .env.example).
      # Ignored once setup has been done in the browser.
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

volumes:
  data:
