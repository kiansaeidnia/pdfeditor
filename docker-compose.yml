# Settings and secrets come from an optional .env file next to this one (KEY=value lines); keep it out of git.
services:
  pdfeditor:
    build:
      context: .
      args:
        OCR_LANGS: ${OCR_LANGS:-eng}  # Tesseract languages baked into the image, e.g. "eng deu fra"
    image: pdfeditor
    ports:
      # Reachable from this machine only by default. BIND=0.0.0.0 opens it to the network: choose a sign-in in setup first.
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - data:/data   # the setup's settings, and (by default) the accounts database and users' files
    environment:
      APP_NAME: ${APP_NAME:-pdfeditor}          # title shown in the UI and the API docs
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}      # largest accepted upload
      CONVERT_TIMEOUT: ${CONVERT_TIMEOUT:-300}  # seconds LibreOffice or OCR may spend on one file
      WORKERS: ${WORKERS:-2}                    # one PDF job at a time per worker
      # Optional: fix where accounts and files are kept, so the setup doesn't ask (see .env.example)
      DATABASE_URL: ${DATABASE_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}

  # Optional Postgres, started only with: docker compose --profile postgres up -d
  # Then use this address in the setup: postgresql://pdfeditor:<POSTGRES_PASSWORD>@postgres:5432/pdfeditor
  # It has no published port, so only the app can reach it.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdfeditor
      POSTGRES_DB: pdfeditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  data:
  postgres:
