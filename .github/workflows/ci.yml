name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pdfeditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # REQUIRE_ALL turns "LibreOffice, OCR or WeasyPrint is missing" from a skip into a failure
      - name: Run the tests inside the image
        run: |
          docker run --rm -e REQUIRE_ALL=1 \
            -v "$PWD/tests:/srv/tests:ro" \
            -v "$PWD/pyproject.toml:/srv/pyproject.toml:ro" \
            -v "$PWD/requirements-dev.txt:/srv/requirements-dev.txt:ro" \
            pdfeditor:ci sh -c "pip install -q --user -r requirements-dev.txt && python -m pytest -q -rs -p no:cacheprovider"

      - name: Smoke test over HTTP
        run: |
          docker run -d --name pdfeditor -p 8080:8080 pdfeditor:ci
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" pdfeditor)" = healthy ]; do sleep 2; done'
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null -w "%{content_type}" http://localhost:8080/ | grep -q text/html
          docker exec pdfeditor python -c "import sys, pymupdf; d = pymupdf.open(); d.new_page(); sys.stdout.buffer.write(d.tobytes())" > tiny.pdf
          curl -fsS -F files=@tiny.pdf -F angle=90 -o rotated.pdf http://localhost:8080/api/tools/rotate
          head -c 5 rotated.pdf | grep -q "%PDF-"

      - name: Container logs
        if: failure()
        run: docker logs pdfeditor || true
