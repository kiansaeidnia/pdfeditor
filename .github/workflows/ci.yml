name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pdfeditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the account and file tests also run on Postgres with files in S3 (moto stands in for S3)
      - name: Start Postgres and S3 for the tests
        run: |
          docker network create tests
          docker run -d --name pg --network tests -e POSTGRES_PASSWORD=test postgres:17-alpine
          docker run -d --name s3 --network tests -p 127.0.0.1:55000:5000 motoserver/moto:5.1.4
          timeout 60 sh -c 'until docker exec pg pg_isready -U postgres -q; do sleep 1; done'
          timeout 60 sh -c 'until curl -fsS -o /dev/null http://127.0.0.1:55000/; do sleep 1; done'

      # REQUIRE_ALL turns "LibreOffice, OCR, WeasyPrint, Postgres or S3 is missing" from a skip into a failure
      - name: Run the tests inside the image
        run: |
          docker run --rm -e REQUIRE_ALL=1 --network tests \
            -e TEST_DATABASE_URL=postgresql://postgres:test@pg:5432/postgres -e TEST_S3_ENDPOINT=http://s3:5000 \
            -v "$PWD/tests:/srv/tests:ro" \
            -v "$PWD/pyproject.toml:/srv/pyproject.toml:ro" \
            -v "$PWD/requirements-dev.txt:/srv/requirements-dev.txt:ro" \
            pdfeditor:ci sh -c "pip install -q --user -r requirements-dev.txt && python -m pytest -q -rs -p no:cacheprovider"

      - name: Smoke test over HTTP
        run: |
          docker run -d --name pdfeditor -p 8080:8080 pdfeditor:ci
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" pdfeditor)" = healthy ]; do sleep 2; done'
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null -w "%{content_type}" http://localhost:8080/ | grep -q text/html
          # a new container is in setup mode: tools are closed until the setup, done here with the code from the log
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/tools/rotate)" = 503
          code=$(docker exec pdfeditor cat /data/setup-code)
          docker logs pdfeditor 2>&1 | grep -qF -- "$code"
          curl -fsS -F code="$code" -F login=accounts -F email=ci@example.com -F password=ci-smoke-test -c jar http://localhost:8080/api/setup
          docker exec pdfeditor python -c "import sys, pymupdf; d = pymupdf.open(); d.new_page(); sys.stdout.buffer.write(d.tobytes())" > tiny.pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' -F files=@tiny.pdf http://localhost:8080/api/tools/rotate)" = 401
          curl -fsS -b jar -F files=@tiny.pdf -F angle=90 -o rotated.pdf http://localhost:8080/api/tools/rotate
          head -c 5 rotated.pdf | grep -q "%PDF-"
          # My files keeps a file and gives the same bytes back
          id=$(curl -fsS -b jar -F files=@rotated.pdf http://localhost:8080/api/files | python3 -c "import json, sys; print(json.load(sys.stdin)['added'][0])")
          curl -fsS -b jar -o back.pdf "http://localhost:8080/api/files/$id"
          cmp rotated.pdf back.pdf
          # the settings and the account survive a restart
          docker restart pdfeditor
          timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" pdfeditor)" = healthy ]; do sleep 2; done'
          curl -fsS -u ci@example.com:ci-smoke-test -F files=@tiny.pdf -o rotated.pdf http://localhost:8080/api/tools/rotate
          curl -fsS -u ci@example.com:ci-smoke-test -o back.pdf "http://localhost:8080/api/files/$id"

      - name: Container logs
        if: failure()
        run: docker logs pdfeditor || true

      # Publishes the exact image that passed the steps above. Never on pull requests. The registry has no login.
      # A commit on main is pushed as "latest" and as its short hash; a git tag like v1.2.0 under its own name.
      # The registry sits behind Cloudflare, which refuses any single upload over 100 MB, and "docker push" sends
      # each layer in one piece. So the image goes to a throwaway local registry and regctl copies it up in chunks.
      - name: Push the tested image to registry.saeidnia.com
        if: github.event_name == 'push'
        env:
          REGCTL_URL: https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          REGCTL_SHA256: 3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc
        run: |
          curl -fsSL -o regctl "$REGCTL_URL"
          echo "$REGCTL_SHA256  regctl" | sha256sum -c -
          chmod +x regctl
          docker run -d --name staging -p 127.0.0.1:5000:5000 registry:3
          timeout 60 sh -c 'until curl -fsS -o /dev/null http://localhost:5000/v2/; do sleep 1; done'
          docker tag pdfeditor:ci localhost:5000/pdfeditor:ci
          docker push -q localhost:5000/pdfeditor:ci
          ./regctl registry set localhost:5000 --tls disabled
          ./regctl registry set registry.saeidnia.com --blob-chunk 50000000 --blob-max 50000000  # bytes
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$GITHUB_REF_NAME"; else tags="latest ${GITHUB_SHA::7}"; fi
          for t in $tags; do
            ./regctl image copy localhost:5000/pdfeditor:ci "registry.saeidnia.com/pdfeditor:$t"
          done
